[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omniscrape"
version = "0.2.0"
description = "Universal dynamic web scraping framework with self-healing adaptive selectors, 3-tier progressive fetchers, and zero-config extraction."
readme = "README.md"
authors = [
    { name = "OmniScrape Team" }
]
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0.0",
    "cssselect>=1.2.0",
    "orjson>=3.9.0",
    "pydantic>=2.5.0",
    "curl_cffi>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "python-dateutil>=2.8.2",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.48.0",
]
stealth = [
    "camoufox>=0.4.0",
]
httpx = [
    "httpx[http2]>=0.27.0",
]
fast = [
    "selectolax>=0.3.21",
]
storage = [
    "duckdb>=1.1.0",
    "asyncpg>=0.30.0",
    "pyarrow>=17.0.0",
]
markdown = [
    "tiktoken>=0.7.0",
]
llm = [
    "anthropic>=0.75.0",
    "openai>=1.50.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
mcp = [
    "fastmcp>=2.3.0",
]
config = [
    "pydantic-settings>=2.4.0",
]
all = [
    "omniscrape[browser,stealth,httpx,fast,storage,markdown,llm,api,mcp,config]",
]
# Benchmark harness only; deliberately NOT part of "all". Competitor tools are installed into
# isolated per-tool environments by `python -m benchmarks envs`.
bench = [
    "psutil>=5.9.0",
    "aiohttp>=3.9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.scripts]
omniscrape = "omniscrape.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/omniscrape"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "network: needs internet access",
    "browser: needs Playwright browsers installed",
    "llm: calls a real LLM API (costs money)",
]
addopts = "-m 'not network and not llm'"
