[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omniscrape"
version = "0.1.0"
description = "Web scraping framework: fetching and rendering, self-healing selectors, zero-config product and article extraction, LLM-ready Markdown and a polite crawler."
readme = "README.md"
authors = [
    { name = "OmniScrape Contributors" }
]
license = { text = "MIT" }
keywords = ["web-scraping", "crawler", "playwright", "curl-cffi", "adaptive-selectors", "markdown", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0.0",
    "cssselect>=1.2.0",
    "orjson>=3.9.0",
    "pydantic>=2.5.0",
    "curl_cffi>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "python-dateutil>=2.8.2",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.48.0",
]
stealth = [
    "camoufox>=0.4.0",
]
httpx = [
    "httpx[http2]>=0.27.0",
]
storage = [
    "duckdb>=1.1.0",
]
markdown = [
    "tiktoken>=0.14.0",
]
mcp = [
    "fastmcp>=2.3.0",
]
fast = [
    "selectolax>=0.3.20",
]
all = [
    "omniscrape[browser,stealth,httpx,storage,markdown,mcp]",
]
# Benchmark harness only; not part of "all". Competitor tools are installed into isolated
# per-tool environments by `python -m benchmarks envs`.
bench = [
    "psutil>=5.9.0",
    "aiohttp>=3.9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "aiohttp>=3.9.0",
]

[project.urls]
Homepage = "https://github.com/loganathan-ai-dev/Omni-Scrape"
Repository = "https://github.com/loganathan-ai-dev/Omni-Scrape"
Issues = "https://github.com/loganathan-ai-dev/Omni-Scrape/issues"

[project.scripts]
omniscrape = "omniscrape.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/omniscrape"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "network: needs internet access",
    "browser: needs Playwright browsers installed",
    "llm: calls a real LLM API (costs money)",
]
addopts = "-m 'not network and not llm'"
