[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omniscrape"
version = "0.1.0"
description = "Universal dynamic web scraping framework with self-healing adaptive selectors, 3-tier progressive fetchers, and zero-config extraction."
readme = "README.md"
authors = [
    { name = "OmniScrape Team" }
]
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0.0",
    "cssselect>=1.2.0",
    "orjson>=3.9.0",
    "pydantic>=2.5.0",
    "curl_cffi>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "python-dateutil>=2.8.2",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.48.0",
]
stealth = [
    "camoufox>=0.4.0",
]
storage = [
    "duckdb>=1.1.0",
    "asyncpg>=0.30.0",
    "pyarrow>=17.0.0",
]
markdown = [
    "markdownify>=0.13.0",
    "tiktoken>=0.7.0",
]
all = [
    "omniscrape[browser,stealth,storage,markdown]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
omniscrape = "omniscrape.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/omniscrape"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
